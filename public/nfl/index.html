<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Depth Charts · Lineups</title>
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="/nfl/nfl.css">
</head>
<body data-tiles="light">
<header class="topbar">
  <a class="brand" href="/">Line<span>ups</span></a>
  <nav class="sports">
    <a href="/nhl/">NHL</a><a href="/nba/">NBA</a><a class="on" href="/nfl/">NFL</a><a href="/soccer/">Soccer</a><span>NCAAB</span>
  </nav>
  <button class="btn team-btn" id="teamBtn" aria-haspopup="true">Loading…</button>
  <div class="spacer"></div>
  <span class="changes" id="changes"></span>
  <div class="seg" id="tileSeg" role="group" aria-label="Tile style">
    <span>Tiles</span><button data-tiles="light">Light</button><button data-tiles="light">Medium</button><button data-tiles="dark">Dark</button>
  </div>
  <button class="btn" id="copyBtn" aria-pressed="false" title="When on, dragging a player to another slot adds them (copy) instead of moving them. Holding Alt/Option does the same.">Copy mode: off</button>
  <button class="btn" id="addBtn">+ Add player</button>
  <button class="btn" id="resetBtn" disabled>Reset to default</button>
</header>

<div class="popover" id="teamPop" hidden>
  <input type="search" id="teamSearch" placeholder="Search teams…" autocomplete="off">
  <div id="teamList"></div>
</div>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <section class="board" id="board" aria-live="polite"></section>
  <aside class="bench" id="bench"></aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <b>Add player</b>
      <button class="btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="search">Search NFL</button>
      <button class="tab" data-tab="custom">Custom player</button>
    </div>
    <div id="tabSearch">
      <input type="search" id="playerSearch" placeholder="Search any NFL player…" autocomplete="off">
      <div id="searchResults" class="results"></div>
    </div>
    <form id="tabCustom" hidden>
      <div class="form-grid">
        <label>Name<input name="name" required></label>
        <label>Number<input name="number" type="number" min="0" max="99"></label>
        <label>Position<input name="pos" placeholder="e.g. WR, CB, OT" required></label>
        <label>Also plays<input name="alt" placeholder="e.g. TE"></label>
      </div>
      <button class="btn primary" type="submit">Add to bench</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/nfl/app.js"></script>
</body>
</html>
