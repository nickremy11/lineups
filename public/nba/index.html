<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Depth Charts · Lineups</title>
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="/nba/nba.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Line<span>ups</span></a>
  <nav class="sports">
    <a href="/nhl/">NHL</a><a class="on" href="/nba/">NBA</a><a href="/nfl/">NFL</a><span>Soccer</span><span>NCAAB</span>
  </nav>
  <button class="btn team-btn" id="teamBtn" aria-haspopup="true">Loading…</button>
  <div class="spacer"></div>
  <span class="changes" id="changes"></span>
  <button class="btn" id="statsBtn" aria-pressed="false" title="Show or hide player stats on tiles">Stats: off</button>
  <button class="btn" id="copyBtn" aria-pressed="false" title="When on, dragging a player between positions adds them (copy) instead of moving them. Holding Alt/Option does the same.">Copy mode: off</button>
  <button class="btn" id="addBtn">+ Add player</button>
  <button class="btn" id="resetBtn" disabled>Reset to default</button>
</header>

<div class="popover" id="teamPop" hidden>
  <input type="search" id="teamSearch" placeholder="Search teams…" autocomplete="off">
  <div id="teamList"></div>
</div>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <section class="board" id="board" aria-live="polite"></section>
  <aside class="bench" id="bench"></aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <b>Add player</b>
      <button class="btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="search">Search NBA</button>
      <button class="tab" data-tab="custom">Custom player</button>
    </div>
    <div id="tabSearch">
      <input type="search" id="playerSearch" placeholder="Search any NBA player…" autocomplete="off">
      <div id="searchResults" class="results"></div>
    </div>
    <form id="tabCustom" hidden>
      <div class="form-grid">
        <label>Name<input name="name" required></label>
        <label>Number<input name="number" type="number" min="0" max="99"></label>
        <label>Positions (primary first)<input name="pos" placeholder="e.g. SG, SF" required></label>
        <label>MPG<input name="mpg" type="number" step="0.1" min="0" max="48"></label>
        <label>PPG<input name="ppg" type="number" step="0.1" min="0"></label>
        <label>RPG<input name="rpg" type="number" step="0.1" min="0"></label>
        <label>APG<input name="apg" type="number" step="0.1" min="0"></label>
        <label>FG%<input name="fg" type="number" step="0.1" min="0" max="100"></label>
        <label>3P%<input name="tp" type="number" step="0.1" min="0" max="100"></label>
      </div>
      <button class="btn primary" type="submit">Add to bench</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script type="module" src="/nba/app.js"></script>
</body>
</html>
